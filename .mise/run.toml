[backlog-browser]
description = "Start the backlog browser web interface for visual task management"
run = "mise exec -- backlog browser"

[build]
description = "Compile the workspace"
run = "cargo check --workspace"

[fmt]
description = "Format Rust sources"
run = "cargo fmt"

[fmt-check]
description = "Check Rust formatting without changing files"
run = "cargo fmt --check"

[check]
description = "Type-check the workspace with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/../target/quality", RUSTFLAGS = "-D warnings" }
run = "cargo check --workspace"

[clippy]
description = "Lint all targets with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/../target/quality" }
run = "cargo clippy --workspace --all-targets -- -D warnings"

[test]
description = "Run the workspace test suite"
env = { CARGO_TARGET_DIR = "{{config_root}}/../target/quality" }
run = "cargo nextest run --workspace"

[schemas]
description = "Regenerate versioned JSON Schemas"
run = "cargo run --quiet --example generate-schemas"

[compatibility]
description = "Compare standalone behavior with devkit v0.1.0"
run = "bash .mise/scripts/compatibility.sh"

[quality]
description = "Run formatting, compile checks, Clippy, and tests"
depends = ["fmt-check", "check", "clippy", "test"]
