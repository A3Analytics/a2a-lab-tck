name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out TCK
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install pinned tools
        uses: jdx/mise-action@v3

      - name: Run standalone quality gate
        run: mise run quality

  action-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out TCK
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Prepare deterministic smoke runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/action-smoke
          printf '{"suite_version":"1.1.0"}\n' >target/action-smoke/fixtures.json
          cat >target/action-smoke/runner.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          while [[ "$#" -gt 0 ]]; do
            case "$1" in
              --report) report="$2"; shift 2 ;;
              *) shift ;;
            esac
          done
          printf '{"suite_version":"1.1.0","selected_suite":"full","enabled_checks":["basic_operations","linked_scenarios"],"compliant":true}\n' >"$report"
          SH
          chmod +x target/action-smoke/runner.sh

      - name: Run local Action smoke path
        id: smoke
        uses: ./
        env:
          A2A_LAB_COMPLIANCE_BIN: ${{ github.workspace }}/target/action-smoke/runner.sh
        with:
          a2a-url: http://127.0.0.1:3000
          mcp-url: http://127.0.0.1:3001/mcp
          fixtures: target/action-smoke/fixtures.json
          profile: "1.1.0"
          suite: full
          llm-check: "false"
          report-path: target/action-smoke/report.json
          implementation-name: a2a-lab-tck-action-smoke
          implementation-version: ${{ github.sha }}

      - name: Verify Action outputs and report
        env:
          COMPLIANT: ${{ steps.smoke.outputs.compliant }}
          REPORT_PATH: ${{ steps.smoke.outputs.report-path }}
        run: |
          set -euo pipefail
          [[ "$COMPLIANT" == "true" ]]
          python3 - "$REPORT_PATH" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              assert json.load(report)["compliant"] is True
          PY
