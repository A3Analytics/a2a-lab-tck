[workspace]
resolver = "3"
members = ["."]

[package]
name = "a2a-lab-tck"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A3 Analytics Technology Compatibility Kit for the A2A-LAB conformance profile"
repository = "https://github.com/A3Analytics/a2a-lab-tck"
publish = false

[dependencies]
a2a-lab-dev-kit = { git = "https://github.com/A3Analytics/a2a-lab-dev-kit-rs", rev = "64ea97d3edcac8f51ba802dbed7fc4a595aec763", default-features = false }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "a2a-lab-compliance"
path = "src/bin/a2a-lab-compliance.rs"

[[bin]]
name = "a2a-lab-compatibility-matrix"
path = "src/bin/a2a-lab-compatibility-matrix.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
type_complexity = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
